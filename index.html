const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let swReady = Promise.resolve();
if ("serviceWorker" in navigator) swReady = navigator.serviceWorker.register("sw.js").catch(()=>{});
async function unlock(key, remember) {
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(IV)}, key, b64d(CT).buffer);
  const appHtml = new TextDecoder().decode(pt);
  if (remember) {
    try { localStorage.setItem("sb_unlockKey", btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey("raw", key))))); } catch(e) {}
  }
  await swReady;
  // AES-GCM authentifiziert den Ciphertext: nur exakt das von build.mjs erzeugte HTML lässt sich entschlüsseln.
  document.open(); document.write(appHtml); document.close();
}
(async () => {
  // sb_unlockKey = eigener Schlüssel. wb_/cl_unlockKey gehören W&B-Tool/Checklisten (gleiche Origin + Passphrase):
  // werden NUR gelesen, nie gelöscht.
  for (const name of ["sb_unlockKey", "wb_unlockKey", "cl_unlockKey"]) {
    let stored = null;
    try { stored = localStorage.getItem(name); } catch(e) {}
    if (!stored) continue;
    try {
      const key = await crypto.subtle.importKey("raw", b64d(stored).buffer, "AES-GCM", true, ["decrypt"]);
      await unlock(key, name !== "sb_unlockKey");
      return;
    } catch(e) {
      if (name === "sb_unlockKey") { try { localStorage.removeItem(name); } catch(_){} }
    }
  }
  document.getElementById("f").addEventListener("submit", async ev => {
    ev.preventDefault();
    const err = document.getElementById("err");
    err.textContent = "Schlüssel wird berechnet\u2026";
    try {
      const pass = document.getElementById("pw").value;
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64d(SALT).buffer, iterations:ITER, hash:"SHA-256"},
        base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
      err.textContent = "";
      await unlock(key, document.getElementById("rem").checked);
    } catch(e) { err.textContent = "Falsche Passphrase."; }
  });
})();
</script>
