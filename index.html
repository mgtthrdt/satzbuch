const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

// Zugangsschlüssel (= PBKDF2 der Passphrase) → K (roh), falls einer der Wraps passt; sonst null
async function unwrap(accessKey) {
  for (const [iv, ct] of W) {
    try { return await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(iv)}, accessKey, b64d(ct).buffer); } catch(e) {}
  }
  return null;
}
const importAccess = b64 => crypto.subtle.importKey("raw", b64d(b64).buffer, "AES-GCM", true, ["decrypt"]);
async function unlock(rawK, rememberKey) {
  const key = await crypto.subtle.importKey("raw", rawK, "AES-GCM", false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(IV)}, key, b64d(CT).buffer);
  const appHtml = new TextDecoder().decode(pt);

  // solange sein Wrap im Bundle steht → Auto-Entsperren überlebt Updates; Wrap entfernen + Redeploy sperrt aus.
  if (rememberKey) {
    try { localStorage.setItem("sb_unlockKey", btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey("raw", rememberKey))))); } catch(e) {}
  }
  await swReady;
  // AES-GCM authentifiziert den Ciphertext: nur exakt das von build.mjs erzeugte HTML lässt sich entschlüsseln.
  document.open(); document.write(appHtml); document.close();
}
(async () => {

  for (const name of ["sb_unlockKey", "wb_unlockKey", "cl_unlockKey"]) {
    let stored = null;
    try { stored = localStorage.getItem(name); } catch(e) {}
    if (!stored) continue;

      const access = await importAccess(stored);

      if (rawK) { await unlock(rawK, name === "sb_unlockKey" ? null : access); return; }
